[project]
name = "entertainx"
version = "0.1.0"
description = "Multi-category entertainment desktop app built with PySide6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.12.0",
    "PySide6_Addons==6.12.0",
    "PySide6_Essentials==6.12.0",
    "PySide6_Pdf==6.12.0.140",
    "PySide6_WebEngine==6.12.0.140",
    "shiboken6==6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
