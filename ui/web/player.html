<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntertainX Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--fg:#f2efe9;--mute:#9a9aa3;--red:#e50914;--pink:#ff4d8d;--line:rgba(255,255,255,.18);
--head:"Syne","Unbounded","Segoe UI",sans-serif;--body:"Manrope","Figtree","Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
#stage{position:fixed;inset:0;background:#000 center/cover no-repeat}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(90deg,rgba(7,7,10,.95) 0%,rgba(7,7,10,.6) 38%,transparent 70%),linear-gradient(0deg,rgba(7,7,10,.95) 0%,transparent 40%)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;z-index:1}
body.playing #stage{background-image:none!important}
body.playing #stage::after{opacity:.0}
body.playing.ui #stage::after{opacity:1;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent 30%),linear-gradient(180deg,rgba(0,0,0,.6),transparent 20%)}
.layer{position:fixed;inset:0;z-index:5;pointer-events:none}
.layer>*{pointer-events:auto}
.fade{transition:opacity .35s}
body:not(.ui) .fade{opacity:0;pointer-events:none}
body:not(.ui){cursor:none}
/* top */
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:20px 24px}
#back{position:absolute;left:20px;top:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.45);cursor:pointer;display:grid;place-items:center}
#back:hover{background:rgba(255,255,255,.14)}
#topTitle{font-size:14px;color:var(--mute);letter-spacing:.02em}
/* info card */
#card{position:absolute;left:clamp(24px,6vw,96px);top:50%;transform:translateY(-50%);width:min(560px,52vw);transition:opacity .35s}
body.playing #card{opacity:0;pointer-events:none}
body.playing.ui.showcard #card{opacity:1;pointer-events:auto}
.srvwrap{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:700}
#srvSel{background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
#srvSel option{background:#111}
#eyebrow{margin-bottom:10px}
#title{font-family:var(--head);font-weight:800;font-size:clamp(32px,5vw,68px);line-height:1.02;letter-spacing:-.02em;margin-bottom:18px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;background:rgba(0,0,0,.35)}
#syn{font-size:15px;line-height:1.6;color:#d6d3cc;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:52ch}
/* side tab */
#tab{position:absolute;right:0;top:50%;transform:translateY(-50%);width:34px;height:150px;border-radius:17px 0 0 17px;background:rgba(0,0,0,.55);
 border:1px solid var(--line);border-right:0;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:width .25s;cursor:default}
#tab:hover,#tab:focus-visible{width:96px}
#tab span{writing-mode:vertical-rl;font-size:11px;letter-spacing:.3em;font-weight:700}
#tab:hover span,#tab:focus-visible span{writing-mode:horizontal-tb}
#tab i{position:absolute;top:12px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}
/* bottom */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 24px 18px}
#bar{position:relative;height:18px;cursor:pointer;display:flex;align-items:center}
#bar .track{position:relative;width:100%;height:3px;background:rgba(255,255,255,.14);border-radius:2px;transition:height .15s}
#bar:hover .track,#bar:focus-visible .track{height:6px}
#buf,#played{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
#buf{background:rgba(255,255,255,.32);width:0}
#played{background:var(--red);width:0}
#played::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--red);transform:scale(0);transition:transform .15s}
#bar:hover #played::after{transform:scale(1)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.grp{display:flex;align-items:center;gap:4px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;position:relative}
.ib:hover{background:rgba(255,255,255,.13)}
.ib[aria-pressed=true]{color:var(--red)}
.ib svg,#back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib .ten{position:absolute;font-size:9px;font-weight:800;top:16px}
#vol{width:0;opacity:0;transition:width .2s,opacity .2s;accent-color:var(--red);cursor:pointer}
.volg:hover #vol,.volg:focus-within #vol{width:84px;opacity:1}
#time{font-size:13px;color:#d6d3cc;margin-left:8px;font-variant-numeric:tabular-nums}
/* panels */
.panel{position:absolute;right:24px;bottom:84px;width:min(340px,86vw);max-height:56vh;overflow:auto;background:rgba(14,14,18,.96);border:1px solid var(--line);border-radius:14px;padding:14px;display:none}
.panel.open{display:block}
.panel h3{font-family:var(--head);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;color:var(--mute)}
.opt{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.opt:hover{background:rgba(255,255,255,.08)}
.opt[aria-current=true]{color:var(--red);font-weight:700}
.opt small{color:var(--mute);display:block;font-size:11px}
/* states */
#toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--line);padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none!important}
#toast.on{opacity:1}
#spin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--red);animation:sp .9s linear infinite;display:none}
#spin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
#err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;z-index:8;background:rgba(7,7,10,.7)}
#err.on{display:flex}
#err p{font-family:var(--head);font-size:clamp(18px,2.4vw,28px);max-width:30ch;line-height:1.25}
#err .acts{display:flex;gap:12px;align-items:center}
#retry{background:var(--red);border:0;border-radius:8px;padding:11px 26px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important}#spin.on{animation:none;border-top-color:var(--red)}}
</style>
</head>
<body class="ui">
<div id="stage"></div>
<video id="v" playsinline crossorigin="anonymous"></video>

<div class="layer" id="ui">
  <div id="top" class="fade">
    <button id="back" aria-label="Back to browse"><svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    <div id="topTitle"></div>
  </div>

  <section id="card" aria-label="Title information">
    <div class="srvwrap"><label class="lbl" for="srvSel">Server</label><select id="srvSel" aria-label="Select server"></select></div>
    <div id="eyebrow" class="lbl">You're watching</div>
    <h1 id="title"></h1>
    <div class="chips" id="chips"></div>
    <p id="syn"></p>
  </section>

  <div id="tab" class="fade" tabindex="0" role="note" aria-label="Content type"><i></i><span id="tabTxt">MOVIE</span></div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="spin" aria-hidden="true"></div>

  <div id="bottom" class="fade">
    <div id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="track"><div id="buf"></div><div id="played"></div></div>
    </div>
    <div class="row">
      <div class="grp">
        <button class="ib" id="bPlay" aria-label="Play"><svg viewBox="0 0 24 24"><path id="playIc" d="M6 4l14 8-14 8z"/></svg></button>
        <button class="ib" id="bBack" aria-label="Rewind 10 seconds"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="ten">10</span></button>
        <button class="ib" id="bFwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span class="ten">10</span></button>
        <div class="grp volg">
          <button class="ib" id="bMute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="volWave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
          <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
        <span id="time" aria-live="off">0:00 / 0:00</span>
      </div>
      <div class="grp">
        <button class="ib" id="bCC" aria-label="Subtitles" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 10a2 2 0 0 0-3 1v2a2 2 0 0 0 3 1M17 10a2 2 0 0 0-3 1v2a2 2 0 0 0 3 1"/></svg></button>
        <button class="ib" id="bList" aria-label="Servers and episodes" aria-haspopup="true"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        <button class="ib" id="bSet" aria-label="Settings" aria-haspopup="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="ib" id="bPip" aria-label="Picture in picture"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1"/></svg></button>
        <button class="ib" id="bFs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
    </div>
    <div class="panel" id="pList" role="dialog" aria-label="Servers and episodes"></div>
    <div class="panel" id="pSet" role="dialog" aria-label="Settings"></div>
  </div>

  <div id="err" role="alert">
    <p id="errMsg">No video source found for this title. Try another server or check back later.</p>
    <div class="acts"><button id="retry">Retry</button><select id="errSel" aria-label="Select server"></select></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
"use strict";
/* ───────────── Server list — edit this only ─────────────
   url may be a direct .m3u8 / .mp4 or a template using {id} (TMDB id), {s} (season), {e} (episode).
   Replace the two test streams with sources you are licensed to use. */
const SERVERS = [
  { name: "Main 1", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
  { name: "Main 2", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" }
];
const TIMEOUT_MS = 8000, HIDE_MS = 3000, SEEK = 10;

const $ = id => document.getElementById(id);
const v = $("v");
const S = { data: null, servers: SERVERS, idx: 0, tried: new Set(), hls: null, timer: null, token: 0, hide: null, failed: false };

/* ───────────── helpers ───────────── */
const fmt = t => { if (!isFinite(t)) return "0:00"; t = Math.floor(t); const h = (t/3600)|0, m = ((t%3600)/60)|0, s = t%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); };
const log = (...a) => console.warn("[player]", ...a);
let toastT; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }
const resolveUrl = (tpl, d) => String(tpl||"").replace("{id}", d.tmdbId ?? d.id ?? "").replace("{s}", d.season ?? 1).replace("{e}", d.episode ?? 1);

/* ───────────── load payload ───────────── */
function load(data){
  S.data = Object.assign({ type: "movie" }, data || {});
  S.servers = Array.isArray(S.data.servers) && S.data.servers.length ? S.data.servers : SERVERS;
  S.idx = Math.min(S.data.serverIndex || 0, S.servers.length - 1);
  const d = S.data, tv = d.type === "tv";
  $("stage").style.backgroundImage = d.backdrop ? `url("${String(d.backdrop).replace(/"/g,"%22")}")` : "none";
  $("topTitle").textContent = d.title || "";
  $("title").textContent = d.title || "";
  $("syn").textContent = d.synopsis || "";
  $("tabTxt").textContent = tv ? "TV" : "MOVIE";
  const chips = $("chips"); chips.textContent = "";
  [d.rating, d.runtime, d.stars != null ? "★ " + d.stars : (d.voteAverage ? "★ " + d.voteAverage : null)].filter(Boolean)
    .forEach(c => { const s = document.createElement("span"); s.className = "chip"; s.textContent = c; chips.appendChild(s); });
  document.title = (d.title || "Player") + (d.year ? " (" + d.year + ")" : "");
  fillServerSelects(); buildListPanel(); buildSettingsPanel();
  S.viewSeason = S.data.season || 1; buildListPanel();
  document.body.classList.remove("playing"); document.body.classList.add("showcard");
  start(S.idx);
}

function fillServerSelects(){
  for (const sel of [$("srvSel"), $("errSel")]) {
    sel.textContent = "";
    S.servers.forEach((s,i) => { const o = document.createElement("option"); o.value = i; o.textContent = s.name; sel.appendChild(o); });
    sel.value = S.idx;
  }
}

/* ───────────── playback + automatic failover ───────────── */
function teardown(){
  clearTimeout(S.timer); S.token++;
  if (S.hls) { try { S.hls.destroy(); } catch(e){} S.hls = null; }
  v.pause(); v.removeAttribute("src"); v.load();
}

function start(i){            // fresh attempt chain: each server is tried at most once
  S.tried = new Set(); S.failed = false;
  $("err").classList.remove("on");
  attempt(i);
}

function attempt(i){
  teardown();
  S.idx = i; S.tried.add(i);
  $("srvSel").value = i; $("errSel").value = i; buildListPanel();
  const srv = S.servers[i], url = resolveUrl(srv && srv.url, S.data);
  const myToken = S.token;
  $("spin").classList.add("on");
  if (!url) { log("empty url for", srv && srv.name); return next(); }

  const ok = () => { if (myToken !== S.token) return; clearTimeout(S.timer); $("spin").classList.remove("on");
    document.body.classList.add("playing"); document.body.classList.remove("showcard"); refreshCC(); buildSettingsPanel();
    v.play().catch(()=>{}); };
  const bad = (why) => { if (myToken !== S.token) return; log(srv.name, why); next(); };

  S.timer = setTimeout(() => bad("timeout"), TIMEOUT_MS);
  v.onerror = () => bad("video error " + (v.error && v.error.code));
  v.onloadeddata = ok;

  const isHls = srv.type === "hls" || /\.m3u8(\?|#|$)/i.test(url);
  if (isHls && window.Hls && Hls.isSupported()) {
    const h = S.hls = new Hls({ maxBufferLength: 30, enableWorker: true });
    h.on(Hls.Events.ERROR, (_, e) => { if (e.fatal) bad("hls " + e.type + "/" + e.details); });
    h.on(Hls.Events.MANIFEST_PARSED, () => { if (!h.levels || !h.levels.length) bad("empty manifest"); });
    h.loadSource(url); h.attachMedia(v);
  } else if (isHls && !v.canPlayType("application/vnd.apple.mpegurl")) {
    bad("hls unsupported");
  } else {
    v.src = url;
  }
}

function next(){
  const n = S.servers.length;
  for (let k = 1; k <= n; k++) {
    const j = (S.idx + k) % n;
    if (!S.tried.has(j)) { toast("Switching to " + S.servers[j].name + "…"); return attempt(j); }
  }
  fail();
}

function fail(){
  teardown(); S.failed = true;
  $("spin").classList.remove("on");
  document.body.classList.remove("playing");
  $("errMsg").textContent = "No video source found for this title. Try another server or check back later.";
  $("err").classList.add("on"); $("retry").focus();
}

/* ───────────── controls ───────────── */
const togglePlay = () => v.paused ? v.play().catch(()=>{}) : v.pause();
const seekBy = d => { if (isFinite(v.duration)) v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime + d)); };
const setVol = x => { v.volume = Math.max(0, Math.min(1, x)); v.muted = v.volume === 0; syncVol(); };
const toggleMute = () => { v.muted = !v.muted; syncVol(); };
function syncVol(){ $("vol").value = v.muted ? 0 : v.volume; $("bMute").setAttribute("aria-label", v.muted ? "Unmute" : "Mute"); $("volWave").style.display = v.muted ? "none" : ""; }
function toggleFs(){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(e=>log(e)); }
async function togglePip(){ try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await v.requestPictureInPicture(); } catch(e){ toast("Picture-in-picture isn't available"); log(e); } }

v.addEventListener("play",  () => { $("bPlay").setAttribute("aria-label","Pause"); $("playIc").setAttribute("d","M6 4h4v16H6zM14 4h4v16h-4z"); });
v.addEventListener("pause", () => { $("bPlay").setAttribute("aria-label","Play");  $("playIc").setAttribute("d","M6 4l14 8-14 8z"); });
v.addEventListener("waiting", () => { if (document.body.classList.contains("playing")) $("spin").classList.add("on"); });
v.addEventListener("playing", () => $("spin").classList.remove("on"));
v.addEventListener("timeupdate", paint); v.addEventListener("progress", paint); v.addEventListener("durationchange", paint);
function paint(){
  const d = v.duration, c = v.currentTime;
  $("time").textContent = fmt(c) + " / " + fmt(d);
  if (isFinite(d) && d > 0) {
    $("played").style.width = (c / d * 100) + "%";
    let b = 0; for (let i = 0; i < v.buffered.length; i++) if (v.buffered.start(i) <= c + .5) b = Math.max(b, v.buffered.end(i));
    $("buf").style.width = (b / d * 100) + "%";
    $("bar").setAttribute("aria-valuenow", Math.round(c / d * 100));
  }
}
$("bar").addEventListener("click", e => { const r = $("bar").getBoundingClientRect(); if (isFinite(v.duration)) v.currentTime = (e.clientX - r.left) / r.width * v.duration; });
$("bPlay").onclick = togglePlay; v.onclick = togglePlay; v.ondblclick = toggleFs;
$("bBack").onclick = () => seekBy(-SEEK); $("bFwd").onclick = () => seekBy(SEEK);
$("bMute").onclick = toggleMute; $("vol").oninput = e => setVol(+e.target.value);
$("bFs").onclick = toggleFs; $("bPip").onclick = togglePip;
$("back").onclick = () => { teardown(); location.hash = "back"; };
$("retry").onclick = () => start(+$("errSel").value || 0);
$("srvSel").onchange = e => start(+e.target.value);
$("errSel").onchange = e => start(+e.target.value);

/* subtitles */
function refreshCC(){ const n = v.textTracks.length; $("bCC").disabled = !n; $("bCC").style.opacity = n ? 1 : .4; $("bCC").title = n ? "Subtitles" : "No subtitles available"; }
$("bCC").onclick = () => { const tt = [...v.textTracks]; if (!tt.length) return; const on = tt.some(t => t.mode === "showing");
  tt.forEach((t,i) => t.mode = (!on && i === 0) ? "showing" : "disabled"); $("bCC").setAttribute("aria-pressed", String(!on)); };

/* panels */
function togglePanel(id){ for (const p of ["pList","pSet"]) $(p).classList.toggle("open", p === id && !$(p).classList.contains("open")); }
$("bList").onclick = () => togglePanel("pList"); $("bSet").onclick = () => togglePanel("pSet");

function episodesForSeason(){
  const sn = S.viewSeason || 1, d = S.data;
  const given = (d.episodes || []).filter(e => e.season === sn);
  if (given.length) return given;
  const meta = (d.seasons || []).find(s => s.number === sn);
  const n = (meta && meta.episodeCount) || 0;
  return Array.from({ length: n }, (_, i) => ({ season: sn, episode: i + 1, title: "" }));
}
function buildListPanel(){
  const p = $("pList"); p.textContent = "";
  const h = document.createElement("h3"); h.textContent = "Servers"; p.appendChild(h);
  S.servers.forEach((s,i) => { const b = document.createElement("button"); b.className = "opt"; b.textContent = s.name;
    if (i === S.idx) b.setAttribute("aria-current","true"); b.onclick = () => { start(i); togglePanel(); }; p.appendChild(b); });
  if (S.data && S.data.type === "tv") {
    const h2 = document.createElement("h3"); h2.textContent = "Episodes"; h2.style.marginTop = "14px"; p.appendChild(h2);
    const seasons = Array.isArray(S.data.seasons) ? S.data.seasons : [];
    if (seasons.length > 1) {
      const sel = document.createElement("select"); sel.id = "seasonSel"; sel.setAttribute("aria-label", "Select season");
      sel.style.cssText = "width:100%;margin-bottom:8px;background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600";
      seasons.forEach(s => { const o = document.createElement("option"); o.value = s.number; o.textContent = s.name || ("Season " + s.number); sel.appendChild(o); });
      sel.value = S.viewSeason || 1;
      sel.onchange = e => { S.viewSeason = +e.target.value; buildListPanel(); const again = $("seasonSel"); if (again) again.focus(); };
      p.appendChild(sel);
    }
    episodesForSeason().forEach(ep => { const b = document.createElement("button"); b.className = "opt";
      b.textContent = `S${ep.season} · E${ep.episode}`; if (ep.title) { const sm = document.createElement("small"); sm.textContent = ep.title; b.appendChild(sm); }
      if (ep.season === S.data.season && ep.episode === S.data.episode) b.setAttribute("aria-current","true");
      b.onclick = () => { S.data.season = ep.season; S.data.episode = ep.episode; if (ep.title) $("topTitle").textContent = `${S.data.title} — S${ep.season}E${ep.episode}`; start(S.idx); togglePanel(); };
      p.appendChild(b); });
  }
}
function buildSettingsPanel(){
  const p = $("pSet"); p.textContent = "";
  const h = document.createElement("h3"); h.textContent = "Speed"; p.appendChild(h);
  [.5,.75,1,1.25,1.5,2].forEach(r => { const b = document.createElement("button"); b.className = "opt"; b.textContent = r === 1 ? "Normal" : r + "×";
    if (v.playbackRate === r) b.setAttribute("aria-current","true"); b.onclick = () => { v.playbackRate = r; buildSettingsPanel(); }; p.appendChild(b); });
  if (S.hls && S.hls.levels && S.hls.levels.length > 1) {
    const h2 = document.createElement("h3"); h2.textContent = "Quality"; h2.style.marginTop = "14px"; p.appendChild(h2);
    const mk = (label, lvl) => { const b = document.createElement("button"); b.className = "opt"; b.textContent = label;
      if (S.hls.currentLevel === lvl) b.setAttribute("aria-current","true"); b.onclick = () => { S.hls.currentLevel = lvl; buildSettingsPanel(); }; p.appendChild(b); };
    mk("Auto", -1); S.hls.levels.forEach((l,i) => mk((l.height ? l.height + "p" : Math.round(l.bitrate/1000) + " kbps"), i));
  }
}

/* auto-hide controls after 3 s */
function wake(){ document.body.classList.add("ui"); clearTimeout(S.hide);
  S.hide = setTimeout(() => { if (!v.paused || document.body.classList.contains("playing")) { document.body.classList.remove("ui"); $("pList").classList.remove("open"); $("pSet").classList.remove("open"); } }, HIDE_MS); }
["mousemove","mousedown","keydown","touchstart"].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
document.body.addEventListener("mouseleave", () => {}); wake();

/* keyboard */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "select" || (tag === "input" && e.target.type !== "range")) return;
  if (e.target.id === "bar" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { /* handled below */ }
  switch (e.key) {
    case " ": case "k": case "K": if (tag === "button" && e.key === " ") return; e.preventDefault(); togglePlay(); break;
    case "ArrowLeft":  e.preventDefault(); seekBy(-SEEK); break;
    case "ArrowRight": e.preventDefault(); seekBy(SEEK); break;
    case "ArrowUp":    e.preventDefault(); setVol(v.volume + .05); break;
    case "ArrowDown":  e.preventDefault(); setVol(v.volume - .05); break;
    case "f": case "F": toggleFs(); break;
    case "m": case "M": toggleMute(); break;
    case "Escape": togglePanel(); break;
  }
});
$("bar").addEventListener("keydown", e => { if (e.key === "Enter") togglePlay(); });

/* public API for the host app */
window.EntertainXPlayer = { load, stop: () => { teardown(); $("err").classList.remove("on"); $("spin").classList.remove("on"); }, servers: () => S.servers };
syncVol(); fillServerSelects();
</script>
