<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Lists - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">TV Shows / TV Lists</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>TV Lists</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/tv/{list_type}</div>
      <p class="page-desc">Discover broadcast schedules: airing today, current on-air shows, popular, and top rated.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="tv-list-type">TV List Type</label>
          <select id="tv-list-type" class="select-field">
            <option value="airing_today">Airing Today (/tv/airing_today)</option>
            <option value="on_the_air">On The Air (/tv/on_the_air)</option>
            <option value="popular">Popular (/tv/popular)</option>
            <option value="top_rated">Top Rated (/tv/top_rated)</option>
          </select>
        </div>
        <div class="input-group" style="max-width: 120px;">
          <label class="input-label" for="tv-page">Page</label>
          <input type="number" id="tv-page" class="input-field" value="1" min="1" max="500" />
        </div>
        <button id="btn-fetch" class="btn-primary">Query List</button>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/tv/airing_today',
      mockKey: 'tv_airing_today',
      defaultParams: { page: 1 },
      onRenderVisual: (data, container) => {
        const results = data.results || [];
        let cards = results.map(t => {
          const poster = t.poster_path ? `${TMDB_IMAGE_BASE}w342${t.poster_path}` : 'https://placehold.co/342x513/1a1f2e/9ba6be?text=No+Poster';
          return `
            <div class="media-card">
              <img src="${poster}" class="card-thumb" alt="${t.name}" />
              <div class="card-body">
                <div class="card-title" title="${t.name}">${t.name}</div>
                <div class="card-sub">
                  <span>${(t.first_air_date || '').slice(0, 4)}</span>
                  <span class="card-rating">★ ${t.vote_average ? t.vote_average.toFixed(1) : 'NR'}</span>
                </div>
                <div class="card-sub" style="font-size: 11px; color: var(--text-dim);">
                  <span>Votes: ${t.vote_count}</span>
                  <span>Pop: ${t.popularity ? t.popularity.toFixed(0) : 0}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>TV Shows (Page ${data.page || 1} of ${data.total_pages || 1} - ${data.total_results || 0} total)</span>
          </div>
          <div class="card-grid">${cards}</div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const type = document.getElementById('tv-list-type').value;
      const page = document.getElementById('tv-page').value || '1';
      explorer.mockKey = `tv_${type}`;
      explorer.execute(`/tv/${type}`, { page });
    });

    explorer.execute();

  </script>
</body>
</html>
