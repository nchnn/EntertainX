<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Media (Images & Videos) - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">TV Shows / TV Media (Images & Videos)</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>TV Media (Images & Videos)</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/tv/{series_id}/images</div>
      <p class="page-desc">High definition artwork, posters, backdrops, and promotional assets for TV.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="tv-id">TV Show ID</label>
          <input type="number" id="tv-id" class="input-field" value="1399" />
        </div>
        <button id="btn-fetch" class="btn-primary">Query TV Media</button>
      </div>
      <div class="quick-samples">
        <span>Quick Samples:</span>
        <span class="sample-chip" data-id="1399">Game of Thrones</span>
        <span class="sample-chip" data-id="66732">Stranger Things</span>
        <span class="sample-chip" data-id="94605">Arcane</span>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/tv/1399/images',
      mockKey: 'tv_images',
      onRenderVisual: (data, container) => {
        const backdrops = data.backdrops || [];
        const posters = data.posters || [];
        const logos = data.logos || [];

        const backdropItems = backdrops.slice(0, 6).map(b => `
          <div class="media-card" style="grid-column: span 2;">
            <img src="${TMDB_IMAGE_BASE}w780${b.file_path}" style="width: 100%; aspect-ratio: 16/9; object-fit: cover;" alt="Backdrop" />
            <div class="card-body">
              <div class="card-sub">
                <span>${b.width} x ${b.height}</span>
                <span>★ ${b.vote_average ? b.vote_average.toFixed(1) : 0} (${b.vote_count} votes)</span>
              </div>
            </div>
          </div>
        `).join('');

        const posterItems = posters.slice(0, 8).map(p => `
          <div class="media-card">
            <img src="${TMDB_IMAGE_BASE}w342${p.file_path}" class="card-thumb" alt="Poster" />
            <div class="card-body">
              <div class="card-sub">
                <span>${p.width} x ${p.height}</span>
                <span>Lang: ${p.iso_639_1 || 'None'}</span>
              </div>
            </div>
          </div>
        `).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>High-Res TV Backdrops (${backdrops.length} total)</span>
          </div>
          <div class="card-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">${backdropItems}</div>

          <div class="section-title" style="margin-top: 32px;">
            <span>Series Posters (${posters.length} total)</span>
          </div>
          <div class="card-grid">${posterItems}</div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const id = document.getElementById('tv-id').value.trim() || '1399';
      explorer.execute(`/tv/${id}/images`);
    });

    document.querySelectorAll('.sample-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('tv-id').value = chip.dataset.id;
        document.getElementById('btn-fetch').click();
      });
    });

    explorer.execute();

  </script>
</body>
</html>
