<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover TV Shows - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">Discover / Discover TV Shows</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>Discover TV Shows</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/discover/tv</div>
      <p class="page-desc">Television exploration engine with air date, network, and genre filtering.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="sort-by">Sort By</label>
          <select id="sort-by" class="select-field">
            <option value="popularity.desc">Popularity Descending</option>
            <option value="vote_average.desc">Rating Descending</option>
            <option value="first_air_date.desc">First Air Date Descending</option>
          </select>
        </div>
        <div class="input-group">
          <label class="input-label" for="with-genres">Genres (e.g. 10765 for Sci-Fi/Fantasy)</label>
          <input type="text" id="with-genres" class="input-field" value="10765" />
        </div>
        <button id="btn-fetch" class="btn-primary">Discover TV</button>
      </div>
      <div class="quick-samples">
        <span>Presets:</span>
        <span class="sample-chip" data-sort="popularity.desc" data-genres="10765">Sci-Fi & Fantasy</span>
        <span class="sample-chip" data-sort="vote_average.desc" data-genres="18">Top Dramas</span>
        <span class="sample-chip" data-sort="popularity.desc" data-genres="16">Animation</span>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/discover/tv',
      mockKey: 'discover_tv',
      defaultParams: {
        sort_by: 'popularity.desc',
        with_genres: '10765'
      },
      onRenderVisual: (data, container) => {
        const results = data.results || [];
        let cards = results.map(t => {
          const poster = t.poster_path ? `${TMDB_IMAGE_BASE}w342${t.poster_path}` : 'https://placehold.co/342x513/1a1f2e/9ba6be?text=No+Poster';
          return `
            <div class="media-card">
              <img src="${poster}" class="card-thumb" alt="${t.name}" />
              <div class="card-body">
                <div class="card-title" title="${t.name}">${t.name}</div>
                <div class="card-sub">
                  <span>${(t.first_air_date || '').slice(0, 4)}</span>
                  <span class="card-rating">★ ${t.vote_average ? t.vote_average.toFixed(1) : 'NR'}</span>
                </div>
                <div class="card-sub" style="font-size: 11px; color: var(--text-dim);">
                  <span>Votes: ${t.vote_count.toLocaleString()}</span>
                  <span>Pop: ${t.popularity.toFixed(0)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>Discovered Shows (Page ${data.page || 1} of ${data.total_pages || 1} - ${data.total_results.toLocaleString()} titles)</span>
          </div>
          <div class="card-grid">${cards}</div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const sort = document.getElementById('sort-by').value;
      const genres = document.getElementById('with-genres').value.trim();
      const params = { sort_by: sort };
      if (genres) params.with_genres = genres;
      explorer.execute('/discover/tv', params);
    });

    document.querySelectorAll('.sample-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('sort-by').value = chip.dataset.sort;
        document.getElementById('with-genres').value = chip.dataset.genres;
        document.getElementById('btn-fetch').click();
      });
    });

    explorer.execute();

  </script>
</body>
</html>
