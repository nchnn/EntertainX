<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Person Credits - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">People / Person Credits</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>Person Credits</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/person/{person_id}/combined_credits</div>
      <p class="page-desc">Comprehensive filmography spanning acting, directing, producing, and crew positions.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="person-id">Person ID</label>
          <input type="number" id="person-id" class="input-field" value="287" />
        </div>
        <div class="input-group">
          <label class="input-label" for="credits-type">Credit Scope</label>
          <select id="credits-type" class="select-field">
            <option value="combined_credits">Combined Credits (Movies + TV)</option>
            <option value="movie_credits">Movie Credits Only</option>
            <option value="tv_credits">TV Credits Only</option>
          </select>
        </div>
        <button id="btn-fetch" class="btn-primary">Query Credits</button>
      </div>
      <div class="quick-samples">
        <span>Quick Samples:</span>
        <span class="sample-chip" data-id="287">Brad Pitt</span>
        <span class="sample-chip" data-id="6193">Leonardo DiCaprio</span>
        <span class="sample-chip" data-id="525">Christopher Nolan</span>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/person/287/combined_credits',
      mockKey: 'person_combined_credits',
      onRenderVisual: (data, container) => {
        const cast = data.cast || [];
        const crew = data.crew || [];

        let topCast = cast.slice(0, 15).map(c => {
          const poster = c.poster_path ? `${TMDB_IMAGE_BASE}w342${c.poster_path}` : 'https://placehold.co/342x513/1a1f2e/9ba6be?text=No+Poster';
          const title = c.title || c.name || 'Untitled';
          const year = (c.release_date || c.first_air_date || '').slice(0, 4) || 'TBA';
          return `
            <div class="media-card">
              <img src="${poster}" class="card-thumb" alt="${title}" />
              <div class="card-body">
                <div class="card-title" title="${title}">${title}</div>
                <div class="card-sub">
                  <span>${year}</span>
                  <span class="card-rating">★ ${c.vote_average ? c.vote_average.toFixed(1) : 'NR'}</span>
                </div>
                <div class="card-sub" style="font-size: 11px; color: var(--accent);">
                  ${c.character ? 'as ' + c.character : 'Cast'}
                </div>
              </div>
            </div>
          `;
        }).join('');

        let topCrew = crew.slice(0, 12).map(cr => `
          <tr>
            <td><strong>${cr.title || cr.name || 'Untitled'}</strong></td>
            <td><span class="genre-tag">${cr.department}</span></td>
            <td>${cr.job}</td>
            <td>${(cr.release_date || cr.first_air_date || '').slice(0, 4) || 'TBA'}</td>
          </tr>
        `).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>Featured Acting Roles (${cast.length} total titles)</span>
          </div>
          <div class="card-grid">${topCast}</div>

          <div class="section-title" style="margin-top: 36px;">
            <span>Production & Crew Credits (${crew.length} total entries)</span>
          </div>
          <div class="schema-table-container">
            <table class="schema-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Department</th>
                  <th>Job</th>
                  <th>Year</th>
                </tr>
              </thead>
              <tbody>${topCrew || '<tr><td colspan="4">No crew credits recorded.</td></tr>'}</tbody>
            </table>
          </div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const id = document.getElementById('person-id').value.trim() || '287';
      const type = document.getElementById('credits-type').value;
      explorer.execute(`/person/${id}/${type}`);
    });

    document.querySelectorAll('.sample-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('person-id').value = chip.dataset.id;
        document.getElementById('btn-fetch').click();
      });
    });

    explorer.execute();

  </script>
</body>
</html>
