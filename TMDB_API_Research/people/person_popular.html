<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popular People - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">People / Popular People</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>Popular People</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/person/popular</div>
      <p class="page-desc">Daily/weekly updated list of trending actors, directors, and industry figures.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group" style="max-width: 140px;">
          <label class="input-label" for="pop-page">Page</label>
          <input type="number" id="pop-page" class="input-field" value="1" min="1" max="500" />
        </div>
        <button id="btn-fetch" class="btn-primary">Query Popular People</button>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/person/popular',
      mockKey: 'person_popular',
      defaultParams: { page: 1 },
      onRenderVisual: (data, container) => {
        const results = data.results || [];
        let cards = results.map(p => {
          const profile = p.profile_path ? `${TMDB_IMAGE_BASE}w185${p.profile_path}` : 'https://placehold.co/185x278/1a1f2e/9ba6be?text=No+Photo';
          const knownForTitles = (p.known_for || []).map(kf => kf.title || kf.name).filter(Boolean).join(', ');
          return `
            <div class="media-card">
              <img src="${profile}" class="card-thumb" alt="${p.name}" />
              <div class="card-body">
                <div class="card-title">${p.name}</div>
                <div class="card-sub">
                  <span>${p.known_for_department || 'Acting'}</span>
                  <span class="card-rating">★ ${p.popularity ? p.popularity.toFixed(0) : 0}</span>
                </div>
                <div class="card-sub" style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">
                  ${knownForTitles || 'Various productions'}
                </div>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>Trending Actors & Filmmakers (Page ${data.page || 1} of ${data.total_pages || 1})</span>
          </div>
          <div class="card-grid">${cards}</div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const page = document.getElementById('pop-page').value || '1';
      explorer.execute(`/person/popular`, { page });
    });

    explorer.execute();

  </script>
</body>
</html>
