<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Content - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">Trending / Trending Content</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>Trending Content</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/trending/{media_type}/{time_window}</div>
      <p class="page-desc">Real-time viral trajectory of movies, television, and creators across day/week windows.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="media-type">Media Domain</label>
          <select id="media-type" class="select-field">
            <option value="movie">Movies (/trending/movie/{time})</option>
            <option value="tv">TV Shows (/trending/tv/{time})</option>
            <option value="person">People (/trending/person/{time})</option>
            <option value="all">All Combined (/trending/all/{time})</option>
          </select>
        </div>
        <div class="input-group">
          <label class="input-label" for="time-window">Time Window</label>
          <select id="time-window" class="select-field">
            <option value="day">Day (Last 24 Hours)</option>
            <option value="week">Week (Last 7 Days)</option>
          </select>
        </div>
        <button id="btn-fetch" class="btn-primary">Query Trending</button>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/trending/movie/day',
      mockKey: 'trending_movie_day',
      onRenderVisual: (data, container) => {
        const results = data.results || [];
        let cards = results.map(item => {
          const isPerson = item.media_type === 'person' || !item.title && item.known_for;
          const imgPath = isPerson ? item.profile_path : item.poster_path;
          const img = imgPath ? `${TMDB_IMAGE_BASE}w342${imgPath}` : 'https://placehold.co/342x513/1a1f2e/9ba6be?text=No+Photo';
          const title = item.title || item.name || 'Untitled';
          const year = (item.release_date || item.first_air_date || '').slice(0, 4);

          return `
            <div class="media-card">
              <img src="${img}" class="card-thumb" alt="${title}" />
              <div class="card-body">
                <div class="card-title" title="${title}">${title}</div>
                <div class="card-sub">
                  ${year ? `<span>${year}</span>` : `<span>${item.known_for_department || 'Actor'}</span>`}
                  ${item.vote_average ? `<span class="card-rating">★ ${item.vote_average.toFixed(1)}</span>` : ''}
                </div>
                <div class="card-sub" style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">
                  <span>Popularity: ${item.popularity.toFixed(0)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>Trending Media (${results.length} items ranked)</span>
          </div>
          <div class="card-grid">${cards}</div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const media = document.getElementById('media-type').value;
      const window = document.getElementById('time-window').value;
      explorer.mockKey = `trending_${media}_${window}`;
      explorer.execute(`/trending/${media}/${window}`);
    });

    explorer.execute();

  </script>
</body>
</html>
