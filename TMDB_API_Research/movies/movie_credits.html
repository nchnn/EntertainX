<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Credits - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">Movies / Movie Credits</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>Movie Credits</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/movie/{movie_id}/credits</div>
      <p class="page-desc">Inspect cast order, character mappings, crew departments, and production roles.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="movie-id">Movie ID</label>
          <input type="number" id="movie-id" class="input-field" value="550" placeholder="e.g. 550" />
        </div>
        <div class="input-group">
          <label class="input-label" for="language">Language</label>
          <input type="text" id="language" class="input-field" value="en-US" />
        </div>
        <button id="btn-fetch" class="btn-primary">Query Credits</button>
      </div>
      <div class="quick-samples">
        <span>Quick Samples:</span>
        <span class="sample-chip" data-id="550">Fight Club</span>
        <span class="sample-chip" data-id="27205">Inception</span>
        <span class="sample-chip" data-id="155">The Dark Knight</span>
        <span class="sample-chip" data-id="299534">Avengers: Endgame</span>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/movie/550/credits',
      mockKey: 'movie_credits',
      onRenderVisual: (data, container) => {
        const cast = data.cast || [];
        const crew = data.crew || [];

        let castCards = cast.slice(0, 18).map(c => {
          const profile = c.profile_path ? `${TMDB_IMAGE_BASE}w185${c.profile_path}` : 'https://placehold.co/185x278/1a1f2e/9ba6be?text=No+Photo';
          return `
            <div class="media-card">
              <img src="${profile}" class="card-thumb" alt="${c.name}" />
              <div class="card-body">
                <div class="card-title">${c.name}</div>
                <div class="card-sub">
                  <span>${c.character || 'Role unspecified'}</span>
                </div>
                <div class="card-sub" style="font-size: 11px; color: var(--text-dim);">
                  <span>Order: ${c.order}</span>
                  <span>Pop: ${c.popularity ? c.popularity.toFixed(1) : '0'}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        let crewRows = crew.slice(0, 25).map(cr => `
          <tr>
            <td><strong>${cr.name}</strong></td>
            <td><span class="genre-tag">${cr.department}</span></td>
            <td>${cr.job}</td>
            <td style="color: var(--text-dim);">${cr.popularity ? cr.popularity.toFixed(1) : '-'}</td>
          </tr>
        `).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>Top Cast (${cast.length} total)</span>
          </div>
          <div class="card-grid">${castCards}</div>

          <div class="section-title" style="margin-top: 36px;">
            <span>Key Crew Members (${crew.length} total)</span>
          </div>
          <div class="schema-table-container">
            <table class="schema-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Job Title</th>
                  <th>Popularity</th>
                </tr>
              </thead>
              <tbody>${crewRows}</tbody>
            </table>
          </div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const id = document.getElementById('movie-id').value.trim() || '550';
      const lang = document.getElementById('language').value.trim() || 'en-US';
      explorer.execute(`/movie/${id}/credits`, { language: lang });
    });

    document.querySelectorAll('.sample-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('movie-id').value = chip.dataset.id;
        document.getElementById('btn-fetch').click();
      });
    });

    explorer.execute();

  </script>
</body>
</html>
