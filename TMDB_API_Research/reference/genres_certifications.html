<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genres & Certifications - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">Reference / Genres & Certifications</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>Genres & Certifications</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/genre/{media}/list</div>
      <p class="page-desc">Official standard genre IDs, localized names, and regulatory content rating classifications.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="ref-type">Taxonomy Type</label>
          <select id="ref-type" class="select-field">
            <option value="genres_movie">Movie Genres (/genre/movie/list)</option>
            <option value="genres_tv">TV Genres (/genre/tv/list)</option>
            <option value="certifications_movie">Movie Certifications (/certification/movie/list)</option>
          </select>
        </div>
        <button id="btn-fetch" class="btn-primary">Query Reference</button>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/genre/movie/list',
      mockKey: 'genres_movie',
      onRenderVisual: (data, container) => {
        if (data.genres) {
          let rows = data.genres.map(g => `
            <tr>
              <td><span class="genre-tag" style="font-size: 13px;">${g.id}</span></td>
              <td><strong>${g.name}</strong></td>
            </tr>
          `).join('');

          container.innerHTML = `
            <div class="section-title">
              <span>Standard Genres (${data.genres.length} categories)</span>
            </div>
            <div class="schema-table-container" style="max-width: 600px;">
              <table class="schema-table">
                <thead>
                  <tr>
                    <th style="width: 140px;">Genre ID</th>
                    <th>Genre Name</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          `;
        } else if (data.certifications) {
          const countries = Object.keys(data.certifications);
          let sections = countries.slice(0, 10).map(c => {
            const list = data.certifications[c] || [];
            const rows = list.map(item => `
              <tr>
                <td><strong>${item.certification}</strong></td>
                <td>${item.meaning}</td>
                <td>${item.order}</td>
              </tr>
            `).join('');

            return `
              <div style="margin-bottom: 24px;">
                <h3 style="color: #60a5fa; margin-bottom: 8px;">Country: ${c}</h3>
                <div class="schema-table-container">
                  <table class="schema-table">
                    <thead>
                      <tr>
                        <th style="width: 140px;">Certification</th>
                        <th>Meaning / Regulatory Scope</th>
                        <th style="width: 80px;">Order</th>
                      </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                </div>
              </div>
            `;
          }).join('');

          container.innerHTML = `
            <div class="section-title">
              <span>Global Certification Systems</span>
            </div>
            ${sections}
          `;
        }
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const type = document.getElementById('ref-type').value;
      if (type === 'genres_movie') {
        explorer.mockKey = 'genres_movie';
        explorer.execute('/genre/movie/list');
      } else if (type === 'genres_tv') {
        explorer.mockKey = 'genres_tv';
        explorer.execute('/genre/tv/list');
      } else {
        explorer.mockKey = 'certifications_movie';
        explorer.execute('/certification/movie/list');
      }
    });

    explorer.execute();

  </script>
</body>
</html>
