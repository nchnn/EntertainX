<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Search - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">Search / Multi-Search</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>Multi-Search</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/search/multi</div>
      <p class="page-desc">Unified search across Movies, TV series, and People in a single prioritized query.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="search-query">Query String</label>
          <input type="text" id="search-query" class="input-field" value="Fight Club" placeholder="Enter keywords..." />
        </div>
        <div class="input-group" style="max-width: 120px;">
          <label class="input-label" for="search-page">Page</label>
          <input type="number" id="search-page" class="input-field" value="1" min="1" max="500" />
        </div>
        <div class="input-group" style="max-width: 140px;">
          <label class="input-label" for="include-adult">Include Adult</label>
          <select id="include-adult" class="select-field">
            <option value="false">False</option>
            <option value="true">True</option>
          </select>
        </div>
        <button id="btn-fetch" class="btn-primary">Search All Media</button>
      </div>
      <div class="quick-samples">
        <span>Quick Samples:</span>
        <span class="sample-chip" data-q="Fight Club">Fight Club</span>
        <span class="sample-chip" data-q="Christopher Nolan">Christopher Nolan</span>
        <span class="sample-chip" data-q="Stranger Things">Stranger Things</span>
        <span class="sample-chip" data-q="Matrix">Matrix</span>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/search/multi',
      mockKey: 'search_multi',
      defaultParams: { query: 'Fight Club' },
      onRenderVisual: (data, container) => {
        const results = data.results || [];
        let cards = results.map(item => {
          const isPerson = item.media_type === 'person';
          const imgPath = isPerson ? item.profile_path : item.poster_path;
          const img = imgPath ? `${TMDB_IMAGE_BASE}w342${imgPath}` : 'https://placehold.co/342x513/1a1f2e/9ba6be?text=No+Photo';
          const title = item.title || item.name || 'Untitled';
          const year = (item.release_date || item.first_air_date || '').slice(0, 4);

          let typeColor = '#3b82f6';
          if (item.media_type === 'tv') typeColor = '#10b981';
          if (item.media_type === 'person') typeColor = '#f59e0b';

          return `
            <div class="media-card">
              <img src="${img}" class="card-thumb" alt="${title}" />
              <div class="card-body">
                <div class="card-title" title="${title}">${title}</div>
                <div class="card-sub">
                  <span class="genre-tag" style="background: ${typeColor}22; color: ${typeColor}; border-color: ${typeColor}55;">
                    ${(item.media_type || 'media').toUpperCase()}
                  </span>
                  ${year ? `<span>${year}</span>` : ''}
                  ${item.vote_average ? `<span class="card-rating">★ ${item.vote_average.toFixed(1)}</span>` : ''}
                </div>
                <p style="font-size: 11px; color: var(--text-dim); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                  ${item.overview || (isPerson ? 'Known for: ' + (item.known_for || []).map(k => k.title || k.name).join(', ') : 'No description')}
                </p>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>Multi-Search Results (${data.total_results || 0} matches across Movies, TV, and People)</span>
          </div>
          <div class="card-grid">${cards || '<div class="state-message">No results found for this search.</div>'}</div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const q = document.getElementById('search-query').value.trim() || 'Inception';
      const page = document.getElementById('search-page').value || '1';
      const adult = document.getElementById('include-adult').value;
      explorer.execute('/search/multi', { query: q, page: page, include_adult: adult });
    });

    document.querySelectorAll('.sample-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('search-query').value = chip.dataset.q;
        document.getElementById('btn-fetch').click();
      });
    });

    explorer.execute();

  </script>
</body>
</html>
