<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Movies - TMDB API Research</title>
  <link rel="stylesheet" href="../assets/css/explorer.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <div class="nav-brand">
        <span class="brand-badge">TMDB API</span>
        <span class="nav-title">Search / Search Movies</span>
      </div>
      <div class="nav-actions">
        <span id="api-status-badge" class="badge badge-mock">
          <span class="badge-dot"></span> Simulated Mode
        </span>
        <button class="btn-secondary open-key-modal">Configure API Key</button>
        <a href="../index.html" class="btn-secondary">Overview Index</a>
      </div>
    </nav>

    <header class="page-header">
      <h1 class="page-title">
        <span class="endpoint-method">GET</span>
        <span>Search Movies</span>
      </h1>
      <div class="endpoint-url">https://api.themoviedb.org/3/search/movie</div>
      <p class="page-desc">Targeted movie query with release year, region, and adult-content flags.</p>
    </header>

    <div class="control-card">
      
      <div class="control-row">
        <div class="input-group">
          <label class="input-label" for="search-query">Movie Title</label>
          <input type="text" id="search-query" class="input-field" value="Inception" placeholder="Search movies..." />
        </div>
        <div class="input-group" style="max-width: 130px;">
          <label class="input-label" for="primary-year">Release Year</label>
          <input type="number" id="primary-year" class="input-field" placeholder="e.g. 2010" />
        </div>
        <div class="input-group" style="max-width: 120px;">
          <label class="input-label" for="search-page">Page</label>
          <input type="number" id="search-page" class="input-field" value="1" min="1" max="500" />
        </div>
        <button id="btn-fetch" class="btn-primary">Search Movies</button>
      </div>
      <div class="quick-samples">
        <span>Quick Samples:</span>
        <span class="sample-chip" data-q="Inception">Inception</span>
        <span class="sample-chip" data-q="Interstellar">Interstellar</span>
        <span class="sample-chip" data-q="Dune">Dune</span>
      </div>

    </div>

    <div class="view-tabs">
      <div class="tab-group">
        <button class="view-tab active" data-tab="visual">Visual View</button>
        <button class="view-tab" data-tab="json">Raw JSON</button>
        <button class="view-tab" data-tab="schema">Response Schema</button>
      </div>
      <div class="view-actions">
        <button id="btn-copy-json" class="btn-secondary">Copy JSON</button>
        <button id="btn-expand-json" class="btn-secondary">Expand All</button>
        <button id="btn-collapse-json" class="btn-secondary">Collapse All</button>
      </div>
    </div>

    <div id="pane-visual" class="view-pane active"></div>
    <div id="pane-json" class="view-pane"></div>
    <div id="pane-schema" class="view-pane"></div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/explorer-core.js"></script>
  <script>

    const explorer = new TMDBExplorer({
      endpoint: '/search/movie',
      mockKey: 'search_movie',
      defaultParams: { query: 'Inception' },
      onRenderVisual: (data, container) => {
        const results = data.results || [];
        let cards = results.map(m => {
          const poster = m.poster_path ? `${TMDB_IMAGE_BASE}w342${m.poster_path}` : 'https://placehold.co/342x513/1a1f2e/9ba6be?text=No+Poster';
          return `
            <div class="media-card">
              <img src="${poster}" class="card-thumb" alt="${m.title}" />
              <div class="card-body">
                <div class="card-title" title="${m.title}">${m.title}</div>
                <div class="card-sub">
                  <span>${(m.release_date || '').slice(0, 4)}</span>
                  <span class="card-rating">★ ${m.vote_average ? m.vote_average.toFixed(1) : 'NR'}</span>
                </div>
                <p style="font-size: 11px; color: var(--text-dim); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                  ${m.overview || 'No synopsis.'}
                </p>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="section-title">
            <span>Movie Matches (${data.total_results || 0} total)</span>
          </div>
          <div class="card-grid">${cards}</div>
        `;
      }
    });

    document.getElementById('btn-fetch').addEventListener('click', () => {
      const q = document.getElementById('search-query').value.trim() || 'Inception';
      const year = document.getElementById('primary-year').value.trim();
      const page = document.getElementById('search-page').value || '1';
      const params = { query: q, page };
      if (year) params.primary_release_year = year;
      explorer.execute('/search/movie', params);
    });

    document.querySelectorAll('.sample-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('search-query').value = chip.dataset.q;
        document.getElementById('btn-fetch').click();
      });
    });

    explorer.execute();

  </script>
</body>
</html>
